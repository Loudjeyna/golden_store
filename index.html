<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Golden Store — هدايا وإكسسوارات، أحدث المنتجات بين يديك">
<title>Golden Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/logo.png" type="image/png">
</head>

<body>

<header>
  <div class="header-in">
    <a class="logo" href="index.html" aria-label="العودة إلى الصفحة الرئيسية">
      <img src="images/logo.png" alt="Golden Store">
    </a>
    <div class="header-actions">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
      <button class="lang-btn" id="lang-btn" onclick="toggleLang()" title="Change language" aria-label="Change language">EN</button>
      <button class="cart-btn" onclick="toggleCart(true)" aria-label="سلة المشتريات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/><path d="M3 3.5h2.4l2.3 11.6a1.6 1.6 0 0 0 1.6 1.3h8a1.6 1.6 0 0 0 1.6-1.3L20.6 7.5H6.1"/></svg>
        <span id="cart-count" class="cart-count" style="display:none">0</span>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <h1 id="hero-title">أهلاً بك في Golden Store 💝</h1>
  <p id="hero-sub">هدايا وإكسسوارات — أحدث المنتجات بين يديك</p>
  <div class="hero-actions">
    <button class="go" id="hero-btn" onclick="document.getElementById('cats-sec').scrollIntoView({behavior:'smooth'})">تصفح الأقسام 🛍️</button>
    <button class="go ghost" id="hero-services-btn" onclick="location.href='services.html'">خدماتنا</button>
  </div>
</section>

<section id="cats-sec" class="sec">
  <div class="sec-head"><h2 id="cats-title">🗂️ الأقسام</h2></div>
  <div id="cat-grid" class="cat-grid"></div>
  <div id="sub-area" style="margin-top:20px"></div>
</section>

<section class="sec"><div id="shop-head"></div></section>

<main>
  <div id="grid" class="grid" aria-live="polite">
    <div class="sk"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
    <div class="sk"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
    <div class="sk"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
    <div class="sk"><div class="sk-img"></div><div class="sk-line"></div><div class="sk-line short"></div></div>
  </div>
</main>

<footer>
  <span id="footer-txt">Golden Store © — جميع الحقوق محفوظة</span>
  <div class="footer-social">
    <a href="https://www.facebook.com/TIFALFALE" target="_blank" rel="noopener" class="social-link fb">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      <span>فيسبوك</span>
    </a>
    <a href="https://m.me/TIFALFALE" target="_blank" rel="noopener" class="social-link msgr">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 4.975 0 11.111c0 3.497 1.745 6.616 4.472 8.652V24l4.086-2.242c1.09.301 2.246.464 3.442.464 6.627 0 12-4.974 12-11.111C24 4.975 18.627 0 12 0zm1.193 14.963l-3.056-3.259-5.963 3.259L10.733 8.1l3.13 3.259 5.889-3.259-6.559 6.863z"/></svg>
      <span>Messenger</span>
    </a>
    <a href="https://wa.me/213778663946" target="_blank" rel="noopener" class="social-link wapp">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span>واتساب</span>
    </a>
  </div>
</footer>

<div id="overlay" class="overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal-body" class="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="scrim" class="scrim" onclick="toggleCart(false)"></div>
<aside id="drawer" class="drawer" aria-label="سلة المشتريات">
  <div class="d-head"><h3 id="cart-title">🛒 سلة المشتريات</h3><button onclick="toggleCart(false)" aria-label="إغلاق السلة">✕</button></div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
